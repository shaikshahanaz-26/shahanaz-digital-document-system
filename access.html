<div class="dashboard-layout"><aside class="sidebar"><a class="logo" href="index.html">Shahanaz<span>Docs.</span></a><p class="sidebar-label">WORKSPACE</p><a href="dashboard.html">▦ Dashboard</a><a href="documents.html">▤ My Documents</a><a href="categories.html">▦ Categories</a><a class="active" href="access.html">♧ Shared Access</a><a href="#" id="logoutBtn">↪ Logout</a></aside>
<main class="dashboard-content"><h1>Shared Access</h1><p class="section-subtitle">Grant document access to another registered user by email.</p>
<form class="card" id="accessForm"><div class="form-group"><label>Document</label><select class="form-control" name="document_id" id="accessDocumentSelect" required><option value="">Select document</option></select></div>
<div class="form-group"><label>Registered user's email</label><input class="form-control" type="email" name="email" required placeholder="user@example.com"></div>
<div class="form-group"><label>Permission</label><select class="form-control" name="permission"><option value="view">View / Download</option><option value="edit">Edit</option></select></div><button class="btn">Grant Access</button><p id="formMessage"></p></form>
<h2 class="section-title" style="margin-top:30px">Access granted</h2><div id="accessList">Loading…</div></main></div><script src="app.js"></script></body></html>
