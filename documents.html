<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Documents | Shahanaz Docs</title><link rel="stylesheet" href="style.css"></head><body>
<div class="dashboard-layout"><aside class="sidebar"><a class="logo" href="index.html">Shahanaz<span>Docs.</span></a><p class="sidebar-label">WORKSPACE</p><a href="dashboard.html">▦ Dashboard</a><a class="active" href="documents.html">▤ My Documents</a><a href="categories.html">▦ Categories</a><a href="access.html">♧ Shared Access</a><a href="#" id="logoutBtn">↪ Logout</a></aside>
<main class="dashboard-content"><div class="dashboard-header"><div><h1>My Documents</h1><p>Upload and manage your digital files.</p></div></div>
<section class="card" id="upload"><h2>Upload a document</h2><form id="uploadForm" enctype="multipart/form-data"><div class="form-group"><label>Document title</label><input class="form-control" name="title" required placeholder="Enter document title"></div>
<div class="form-group"><label>Category</label><select class="form-control" name="category_id" id="categorySelect"><option value="">Select category</option></select></div>
<div class="form-group"><label>Choose file (max 15 MB)</label><input class="form-control" type="file" name="file" required><small class="file-name"></small></div><button class="btn">Upload Document</button><p id="formMessage"></p></form></section>
<div style="margin-top:35px"><h2 class="section-title">All Documents</h2><input class="search-bar" id="searchInput" placeholder="Search your documents…"><div id="documentsList">Loading…</div></div></main></div><script src="app.js"></script></body></html>
